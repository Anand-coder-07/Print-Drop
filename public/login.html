<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PrintDrop owner login — access your print dashboard">
  <title>PrintDrop — Owner Login</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-icon">🖨️</div>
          <span class="login-logo-text">PrintDrop</span>
        </div>
        <p class="login-subtitle">Shop Owner Dashboard</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit" id="loginBtn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
