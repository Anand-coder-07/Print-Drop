<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PrintDrop owner login — access your print dashboard">
  <title>PrintDrop — Staff Sign In</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2318232b'/%3E%3Cpath d='M28 42h44v30H28zM35 28h30v14H35zM35 58h30v18H35z' fill='none' stroke='%23fffdf9' stroke-width='6'/%3E%3C/svg%3E">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 20h20v-8H14v8Zm-4 4h28a4 4 0 0 1 4 4v8H6v-8a4 4 0 0 1 4-4Zm4 12h20v8H14v-8Z"/><path d="M31 28h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <span class="login-logo-text">PrintDrop</span>
        </div>
        <p class="login-subtitle">Secure staff access</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Enter your Password" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit" id="loginBtn">
          Access dashboard
        </button>
      </form>
      <p class="login-register-link">New print shop? <a href="/owner.html?mode=signup">Create a shop account</a></p>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
