<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PrintDrop owner dashboard — view and manage student print uploads in real time">
  <title>PrintDrop — Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
</head>
<body>
  <div class="app" id="app">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-brand">
        <div class="nav-logo">🖨️</div>
        <span class="nav-title">PrintDrop</span>
      </div>
      <div class="nav-actions">
        <span class="nav-user" id="navUser">Owner</span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
      </div>
    </nav>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value pending" id="statPending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-value total-files" id="statFiles">0</div>
        <div class="stat-label">Total Files</div>
      </div>
      <div class="stat-card">
        <div class="stat-value storage" id="statStorage">0 B</div>
        <div class="stat-label">Storage</div>
      </div>
    </div>

    <!-- Queue -->
    <div class="queue-header">
      <h1 class="queue-title">
        <span class="live-dot"></span>
        Print Queue
      </h1>
      <span class="queue-subtitle">Real-time updates enabled</span>
    </div>

    <div class="queue-list" id="queueList">
      <div class="empty-state" id="emptyState">
        <span class="empty-icon">📭</span>
        <h2 class="empty-title">No pending uploads</h2>
        <p class="empty-subtitle">New uploads from students will appear here in real time</p>
      </div>
    </div>

    <!-- QR Code Section -->
    <div class="qr-section">
      <h3 class="qr-title">📱 Student QR Code</h3>
      <div class="qr-image">
        <img src="/qr.png" alt="Scan to upload files" id="qrImg">
      </div>
      <p class="qr-hint">Print this QR code and display it near your shop counter</p>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">File Preview</span>
        <div class="modal-actions">
          <button class="modal-action-btn print-btn" id="modalPrintBtn" title="Direct Print">🖨️ Direct Print</button>
          <button class="modal-action-btn" id="modalDirectViewBtn" title="Open directly in new tab">↗️ Direct View</button>
          <button class="modal-close" id="modalClose" title="Close">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon">🔔</span>
    <div class="toast-content">
      <div class="toast-title" id="toastTitle">New Upload</div>
      <div class="toast-message" id="toastMessage"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
